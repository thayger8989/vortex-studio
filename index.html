<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vórtex Studio Premium — Web Apps & Soluções Digitais</title>
<style>
:root {
--bg: #07080d;
--card: #11131c;
--bd: #1f2333;
--tx: #f3f4f6;
--mu: #9ca3af;
--br: #6366f1;
--cy: #22d3ee;
--gr: #10b981;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px;height:100%}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
a{color:inherit;text-decoration:none}
.w{max-width:1100px;margin:0 auto;padding:0 20px}
/* Keyframes */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 15px rgba(99,102,241,0.25); } 50% { box-shadow: 0 0 25px rgba(34,211,238,0.4); } }
/* Header Flutuante */
header{position:fixed;top:16px;left:0;right:0;z-index:1000;display:flex;justify-content:center}
header .hdr-w{width:calc(100% - 32px);max-width:1100px;background:rgba(17,19,28,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.logo{font-weight:900;letter-spacing:.1em;font-size:16px}.logo small{display:block;font-size:9px;color:var(--br);letter-spacing:.3em;margin-top:-2px}
nav{display:flex;gap:24px;font-size:14px;color:var(--mu);font-weight:500}
nav a{transition:color .2s}nav a:hover{color:var(--tx)}
.hdr-btn{display:flex;gap:10px;align-items:center}
.menu-btn{display:none;background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
@media(max-width:850px){
nav{display:none}
.menu-btn{display:block}
}
/* Mobile Drawer */
.drawer{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(7,8,13,0.95);backdrop-filter:blur(20px);z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;font-size:20px;font-weight:700;transform:translateY(-100%);transition:transform .3s cubic-bezier(0.16, 1, 0.3, 1)}
.drawer.open{transform:translateY(0)}
.drawer a{color:var(--tx)}.drawer .close-btn{position:absolute;top:24px;right:24px;font-size:28px;background:none;border:none;color:var(--mu);cursor:pointer}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:12px;font-weight:700;font-size:14px;background:linear-gradient(90deg,#4f46e5,#6366f1);color:#fff;transition:all .2s ease;cursor:pointer;border:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(99,102,241,0.4)}
.btn.g{background:var(--gr)}.btn.g:hover{box-shadow:0 8px 20px rgba(16,185,129,0.4)}
.btn.ig{background:linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888)}.btn.ig:hover{box-shadow:0 8px 20px rgba(220,39,67,0.4)}
.btn.outline{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.outline:hover{border-color:var(--br);background:rgba(99,102,241,0.1)}
/* Hero */
.hero{text-align:center;padding:140px 0 60px;animation:fadeInUp .8s cubic-bezier(0.16, 1, 0.3, 1)}
.tag{display:inline-block;font-size:12px;padding:6px 16px;border-radius:99px;border:1px solid rgba(99,102,241,.4);background:rgba(99,102,241,.1);color:#a5b4fc;margin-bottom:22px;animation:pulseGlow 4s infinite}
h1{font-size:clamp(32px,6vw,58px);line-height:1.15;font-weight:800;letter-spacing:-0.02em}
h1 span{background:linear-gradient(90deg,#6366f1,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);max-width:640px;margin:20px auto 0;font-size:17px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;margin-top:60px;padding-top:30px;border-top:1px solid var(--bd)}
.stats b{display:block;font-size:26px}.stats small{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
/* Sections */
section{padding:70px 0}
.alt{background:var(--card);border-block:1px solid var(--bd)}
h2{font-size:clamp(24px,4vw,34px);text-align:center}
.sub{text-align:center;color:var(--mu);margin:10px auto 40px;max-width:580px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.c{background:var(--bg);border:1px solid var(--bd);border-radius:18px;padding:24px;transition:all .3s ease;display:flex;flex-direction:column;justify-content:space-between}
.c:hover{transform:translateY(-4px);border-color:var(--br);box-shadow:0 12px 30px rgba(0,0,0,0.4)}
.c h3{margin-bottom:8px;font-size:18px}.c p{color:var(--mu);font-size:14px;line-height:1.6}
/* Direct Interactive Phone Mockup Section */
.demo-center{display:flex;flex-direction:column;align-items:center;width:100%}
.phone-container{display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px;margin:0 auto}
.phone-nav-tabs{display:flex;gap:6px;background:rgba(255,255,255,0.05);padding:6px;border-radius:14px;margin-bottom:16px;border:1px solid var(--bd);width:100%;justify-content:center}
.phone-tab{background:none;border:none;color:var(--mu);padding:8px 12px;border-radius:10px;font-weight:600;font-size:12px;cursor:pointer;transition:all .2s;flex:1;text-align:center}
.phone-tab.active{background:var(--br);color:#fff}
.phone{width:100%;background:#000;border:8px solid #252836;border-radius:42px;padding:12px;box-shadow:0 25px 50px rgba(0,0,0,0.6)}
.scr{background:#0d0e15;border-radius:30px;height:520px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.ah{background:#12141f;border-bottom:1px solid #262a3d;padding:14px;font-weight:800;letter-spacing:.05em;display:flex;align-items:center}
.ah small{display:block;color:var(--cy);font-size:9px;letter-spacing:.2em}
.ab{padding:14px;flex:1;overflow:auto}
.os{background:#181b28;border-radius:12px;padding:10px 12px;font-size:12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,0.05)}
.os em{font-style:normal;color:var(--cy);font-weight:700}
.act{width:100%;margin-top:14px;background:var(--br);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s}
.act:hover{opacity:.9}
#tst{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:#fff;color:#000;font-size:11px;font-weight:700;padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:10}
/* Itens interativos do protótipo */
.lbl{font-size:11px;color:var(--mu);margin-bottom:6px}
.os.tap{cursor:pointer;transition:border-color .2s}
.os.tap:hover{border-color:var(--br)}
.badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:3px}
.chip{flex:1;padding:8px;border-radius:8px;border:1px solid #333;color:#fff;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.chip:hover{border-color:var(--br)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:24px;height:24px;border-radius:8px;border:0;background:var(--br);color:#fff;font-weight:800;cursor:pointer;font-family:inherit}
.qty button.minus{background:#262a3d}
.qty b{min-width:14px;text-align:center;font-size:12px}
/* Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:32px;max-width:480px;width:100%;position:relative}
.modal-close{position:absolute;top:20px;right:20px;background:none;border:none;color:var(--mu);font-size:24px;cursor:pointer}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--tx)}
.form-group input, .form-group textarea, .form-group select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;color:#fff;font-family:inherit;font-size:14px}
.form-group input:focus, .form-group textarea:focus{outline:none;border-color:var(--br)}
/* FAQ & Footer */
details{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:16px 20px;margin-bottom:12px;transition:border-color .2s}
details:hover{border-color:var(--br)}
summary{cursor:pointer;font-weight:600}details p{color:var(--mu);margin-top:10px;font-size:14px}
footer{border-top:1px solid var(--bd);padding:40px 0;text-align:center;color:var(--mu);font-size:13px}
.contact-bar{display:flex;gap:20px;justify-content:center;align-items:center;flex-wrap:wrap;margin:16px 0}
.contact-link{color:var(--tx);font-weight:600;transition:color .2s}.contact-link:hover{color:var(--cy)}
</style>
</head>
