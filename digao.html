<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digão Estética Automotiva – Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{red:{400:"#ff5a4a",500:"#f5200d",600:"#e31b0c",700:"#b81408"}}}}}</script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#080808;color:#fff;font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;margin:0}
.card{background:#151515;border:1px solid rgba(232,24,8,.35);border-radius:16px}
.lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#a1a1aa;font-weight:500}
.bd{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.r{background:rgba(232,24,8,.2);color:#ff4a38}.g{background:rgba(34,197,94,.18);color:#4ade80}
.b{background:rgba(59,130,246,.2);color:#60a5fa}.a{background:rgba(245,158,11,.2);color:#fbbf24}
.btn{background:#e31b0c;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600}
.btn:active,.card:active{transform:scale(.97)}
.ghost{background:#2a2a2d}
input,select{background:#080808;border:1px solid #3f3f46;border-radius:10px;padding:11px;width:100%;font-size:14px;color:#fff;font-family:inherit}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

 var k=function(ico,l,v,bd,cl,t){return '<button onclick="go(\''+t+'\')" class="card p-4 text-left"><div class="text-red-500 mb-3">'+ico+'</div><p class="text-[13px] text-zinc-400 font-medium">'+l+'</p><p class="text-3xl font-bold mt-1 mb-2">'+v+'</p><span class="bd '+cl+'">'+bd+'</span></button>'};
 var sc=function(ico,l,f){return '<button onclick="'+f+'" class="card py-4 flex flex-col items-center gap-2 text-red-500">'+ico+'<span class="text-[13px] font-semibold text-white">'+l+'</span></button>'};
 var M=[["Jan",18],["Fev",21],["Mar",26],["Abr",32]];
 var bars=M.map(function(m,i){return '<div class="flex items-center gap-3 text-[13px]"><span class="w-7 text-zinc-400 font-medium">'+m[0]+'</span><div class="flex-1 h-2.5 bg-zinc-800 rounded-full"><div class="h-2.5 rounded-full" style="width:'+m[1]/34*100+'%;background:'+(i==3?"#ff3b2b":"#e31b0c")+'"></div></div><b class="w-12 text-right">R$'+m[1]+'k</b></div>'}).join("");
 var pl=patio.slice(0,3).map(function(x){return '<div class="flex justify-between items-center py-3 border-t border-zinc-800 first:border-0"><div><p class="font-bold">'+x.p+'</p><p class="text-[13px] text-zinc-400">'+x.s+'</p></div><span class="bd '+ST[x.st][1]+'">'+ST[x.st][0]+'</span></div>'}).join("");
 return '<p class="lbl">Painel geral — hoje</p><div class="grid grid-cols-2 gap-3">'+k(ic("dollar"),"Faturamento do dia",brl(fat()),"↑ +12,5%","g","patio")+k(ic("car"),"Veículos no pátio",patio.length,"Em atendimento","r","patio")+k(ic("cal"),"Agendamentos hoje",ag.length,"Confirmados","b","agenda")+k(ic("fd"),"OS abertas",os.length,low?low+" estoque baixo":"Pendentes","r","os")+'</div>'+
 '<p class="lbl pt-1">Atalhos rápidos</p><div class="grid grid-cols-3 gap-3">'+sc(ic("plus"),"Nova OS","go(\'os\',\'nova\')")+sc(ic("calp"),"Agendar","go(\'agenda\',\'novo\')")+sc(ic("fd"),"Orçamento","go(\'os\',\'orc\')")+'</div>'+
 '<div class="card p-4 space-y-3"><p class="lbl">Faturamento mensal</p>'+bars+'</div><div class="card p-4"><p class="lbl mb-1">Pátio agora</p>'+pl+'</div>'}
function vPatio(){var s=S.sub.patio;if(s=="entregues")return ent.length?ent.map(function(x){return '<div class="card p-4 flex justify-between"><div><p class="font-bold">'+x.p+'</p><p class="text-[13px] text-zinc-400">'+x.s+'</p></div><b class="text-emerald-400">'+brl(x.v)+'</b></div>'}).join(""):'<p class="text-center text-zinc-500 py-10 text-sm">Nenhuma entrega ainda. Conclua e entregue um veículo no pátio.</p>';
 return patio.map(function(x,i){var t=ST[x.st];return '<div class="card p-4 flex justify-between items-center"><div><p class="font-bold">'+x.p+'</p><p class="text-[13px] text-zinc-400">'+x.s+' · '+brl(x.v)+'</p></div><button onclick="adv('+i+')" class="bd '+t[1]+'">'+(x.st=="concl"?"Entregar ›":t[0]+" ›")+'</button></div>'}).join("")+'<p class="text-xs text-zinc-500 text-center">Toque no status para avançar o veículo.</p>'}
function vOs(){var s=S.sub.os;
 if(s=="nova")return '<div class="card p-4 space-y-3"><p class="font-semibold">Nova Ordem de Serviço</p><input id="f_p" placeholder="Placa (ex.: XYZ-1234)" maxlength="8"><select id="f_s">'+opts()+'</select><button class="btn w-full py-3" onclick="criar()">Abrir OS</button></div>';
 if(s=="orc"){var ch=Object.keys(SERV).map(function(k){return '<button onclick="tog(\''+k+'\')" class="flex justify-between w-full p-3 rounded-xl border '+(Q.sel[k]?"border-red-500 bg-red-600/15":"border-zinc-700")+' text-sm"><span>'+(Q.sel[k]?"✓ ":"")+k+'</span><b>'+brl(SERV[k])+'</b></button>'}).join("");
  return '<div class="card p-4 space-y-3"><p class="font-semibold">Orçamento rápido</p><input placeholder="Nome do cliente" value="'+Q.n+'" oninput="Q.n=this.value">'+ch+'<div class="flex justify-between text-lg font-bold pt-1"><span>Total</span><span class="text-red-500">'+brl(qtot())+'</span></div><button class="btn w-full py-3" onclick="enviaOrc()">Enviar por WhatsApp</button></div>'}
 return os.length?os.map(function(o){return '<div class="card p-4 flex justify-between items-center"><div><p class="font-bold">OS #'+o.n+' · '+o.p+'</p><p class="text-[13px] text-zinc-400">'+o.s+'</p></div><b>'+brl(o.v)+'</b></div>'}).join(""):'<p class="text-center text-zinc-500 py-10 text-sm">Nenhuma OS aberta.</p>'}
function vAgenda(){if(S.sub.agenda=="novo")return '<div class="card p-4 space-y-3"><p class="font-semibold">Novo agendamento</p><input id="a_h" type="time" value="16:00"><input id="a_c" placeholder="Nome do cliente"><select id="a_s">'+opts()+'</select><button class="btn w-full py-3" onclick="agendar()">Confirmar</button></div>';
 return ag.map(function(a){return '<div class="card p-4 flex items-center gap-4"><b class="text-red-500 w-12">'+a[0]+'</b><div class="flex-1"><p class="font-semibold">'+a[1]+'</p><p class="text-[13px] text-zinc-400">'+a[2]+'</p></div><span class="bd b">Confirmado</span></div>'}).join("")}
function vCli(){var s=S.sub.cli,h="";cli.forEach(function(c,i){if(s=="pos"&&c.d<30)return;
 h+='<div class="card p-4 flex justify-between items-center"><div><p class="font-semibold">'+c.n+'</p><p class="text-[13px] text-zinc-400">'+c.c+' · há '+c.d+' dias</p></div>'+(s=="pos"?'<button class="btn" onclick="wpp(\'Olá, '+c.n.split(" ")[0]+'! Já faz '+c.d+' dias da última visita do seu '+c.c+'. Vamos agendar uma nova lavagem na Digão Estética?\')">WhatsApp</button>':'<span class="text-xs text-zinc-500">'+c.t+'</span>')+'</div>'});
 return (s=="pos"?'<p class="text-xs text-zinc-400">Clientes com 30+ dias sem visita:</p>':"")+h}
function vEst(){var s=S.sub.est,h="";est.forEach(function(e,i){var lw=e.q<=e.m;if(s=="alerta"&&!lw)return;
 h+='<div class="card p-4"><div class="flex justify-between items-center"><div><p class="font-semibold">'+e.n+'</p><p class="text-[13px] '+(lw?"text-amber-400":"text-zinc-400")+'">'+e.q+' un · mínimo '+e.m+(lw?" · ⚠️ baixo":"")+'</p></div>'+(s=="alerta"?'<button class="btn" onclick="toast(\'📦 Reposição solicitada\')">Repor</button>':'<div class="flex gap-2"><button class="btn ghost w-9" onclick="qty('+i+',-1)">−</button><button class="btn w-9" onclick="qty('+i+',1)">+</button></div>')+'</div><div class="h-1.5 bg-zinc-800 rounded mt-3"><div class="h-1.5 rounded '+(lw?"bg-amber-500":"bg-emerald-500")+'" style="width:'+Math.min(100,e.q/(e.m*3)*100)+'%"></div></div></div>'});
 return h||'<p class="text-center text-zinc-500 py-10 text-sm">Estoque em dia 🎉</p>'}
function vFin(){var M=[["Jan",18],["Fev",21],["Mar",26],["Abr",32]];return '<div class="card p-4"><p class="lbl">Hoje</p><p class="text-3xl font-bold mt-1">'+brl(fat())+'</p><span class="bd g mt-2">↑ +12,5%</span></div><div class="card p-4 space-y-3"><p class="lbl">Faturamento mensal</p>'+M.map(function(m){return '<div class="flex items-center gap-3 text-[13px]"><span class="w-7 text-zinc-400">'+m[0]+'</span><div class="flex-1 h-2.5 bg-zinc-800 rounded-full"><div class="h-2.5 rounded-full bg-red-600" style="width:'+m[1]/34*100+'%"></div></div><b>R$'+m[1]+'k</b></div>'}).join("")+'</div>'}
function render(){
 document.getElementById("mb").innerHTML=ic("menu");
 document.getElementById("nav").innerHTML=NAV.map(function(n){var a=S.tab==n[0];return '<button onclick="go(\''+n[0]+'\')" class="py-3 flex justify-center '+(a?"text-red-500":"text-zinc-400")+'">'+ic(n[1])+'</button>'}).join("");
 document.getElementById("drl").innerHTML=DR.map(function(d){return '<button onclick="go(\''+d[3]+'\''+(d[4]?',\''+d[4]+'\'':"")+')" class="w-full flex items-center gap-3 p-3 rounded-xl bg-zinc-900 border border-zinc-800 text-left text-sm font-medium"><span class="text-red-500">'+ic(d[1])+'</span>'+d[2]+'</button>'}).join("")+'<button onclick="drawer(0);toast(\'⚙️ Configurações: na versão final\')" class="w-full flex items-center gap-3 p-3 rounded-xl bg-zinc-900 border border-zinc-800 text-left text-sm font-medium">⚙️ Configurações</button>';
 var sb=SUBS[S.tab]||[];document.getElementById("subs").innerHTML=sb.map(function(x){var a=S.sub[S.tab]==x[0];return '<button onclick="sub(\''+x[0]+'\')" class="whitespace-nowrap text-sm px-4 py-1.5 rounded-full border '+(a?"bg-red-600 border-red-600 font-semibold":"border-zinc-700 text-zinc-300")+'">'+x[1]+'</button>'}).join("");
 document.getElementById("view").innerHTML={home:vHome,patio:vPatio,os:vOs,agenda:vAgenda,cli:vCli,est:vEst,fin:vFin}[S.tab]()}
render();
setTimeout(function(){var e=document.getElementById("sp");if(e){e.style.opacity=0;setTimeout(function(){e.remove()},500)}},2200);
</script>
